<!-- ===== Banner de alerta "Esto se traduce en carritos abandonados..." (Sizebay) – colar em um bloco HTML do RD Station ===== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">

<style>
  .sbz-alert{
    --sbz-alert-bg:#042a44;
    --sbz-alert-text:#ffffff;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:17px;
    width:100%;
    max-width:1196px;
    margin:0 auto;
    padding:22px 58px;
    background:var(--sbz-alert-bg);
    border-radius:21px;
    box-sizing:border-box;
    font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  }
  .sbz-alert *{box-sizing:border-box}
  .sbz-alert__icon{
    flex:0 0 auto;
    display:block;
    width:185px;
    height:auto;
  }
  .sbz-alert__text{
    margin:0;
    max-width:766px;
    font-size:28px;
    line-height:1.5;
    font-weight:700;
    color:var(--sbz-alert-text);
  }
  @media (max-width:768px){
    .sbz-alert{flex-direction:column;text-align:center;gap:8px;padding:24px 20px}
    .sbz-alert__icon{width:110px}
    .sbz-alert__text{font-size:20px}
  }
</style>

<div class="sbz-alert">
  <img class="sbz-alert__icon" src="https://d335luupugsy2.cloudfront.net/cms/files/933370/1792779401/$v0mfa14mqd" alt="" width="185" height="184">
  <p class="sbz-alert__text">Esto se traduce en carritos abandonados y devoluciones. Hoy, hasta el 30% de los consumidores abandonan la compra por dudas con la talla.</p>
</div>
