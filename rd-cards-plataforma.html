<!-- ===== Cards "Probador Virtual / Vitrina virtual" (Sizebay) – colar em um bloco HTML do RD Station ===== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap" rel="stylesheet">

<style>
  .sbz-cards{
    --sbz-card-bg:#d2ecff;
    --sbz-text:#07385a;
    --sbz-icon:#2f82bc;
    --sbz-radius:21px;
    display:flex;
    flex-direction:column;
    gap:14px;
    width:100%;
    max-width:515px;
    box-sizing:border-box;
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  }
  .sbz-cards *{box-sizing:border-box}
  .sbz-cards__card{
    display:flex;
    align-items:center;
    gap:18px;
    padding:22px 24px;
    background:var(--sbz-card-bg);
    border-radius:var(--sbz-radius);
  }
  .sbz-cards__icon{
    flex:0 0 80px;
    width:80px;
    height:80px;
    border-radius:50%;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--sbz-icon);
  }
  .sbz-cards__icon svg{display:block;width:36px;height:auto;fill:currentColor}
  .sbz-cards__icon svg.is-bag{width:34px}
  .sbz-cards__text{
    margin:0;
    font-size:22px;
    line-height:1.5;
    font-weight:700;
    color:var(--sbz-text);
  }
  @media (max-width:768px){
    .sbz-cards{max-width:none}
    .sbz-cards__card{gap:14px;padding:16px 18px}
    .sbz-cards__icon{flex-basis:64px;width:64px;height:64px}
    .sbz-cards__icon svg{width:28px}
    .sbz-cards__icon svg.is-bag{width:27px}
    .sbz-cards__text{font-size:18px}
  }
</style>
