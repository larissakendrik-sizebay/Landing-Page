<!-- ===== Imagem do hero (jaqueta puffer) com cards "vidro" (Sizebay) – colar em um bloco HTML do RD Station ===== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500&display=swap" rel="stylesheet">

<style>
  .sbz-pf{
    --u:1px;                         /* 1 unidade = 1px no desenho original (599 x 760) */
    --sbz-text:#434a50;
    --sbz-text-2:#484848;
    --sbz-line:#84c4f1;
    --sbz-skeleton:#dde7ee;
    position:relative;
    width:100%;
    max-width:599px;
    aspect-ratio:599/760;
    margin:0 auto;
    overflow:hidden;
    container-type:inline-size;
    font-family:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  }
  @supports (width:1cqw){ .sbz-pf{--u:calc(100cqw / 599)} }
  .sbz-pf *{box-sizing:border-box}
  .sbz-pf__photo{
    position:absolute;
    left:calc(var(--u)*-30);top:calc(var(--u)*53);
    width:calc(var(--u)*623);height:calc(var(--u)*707);
    z-index:1;                       /* na frente do produto e dos dados pessoais, atrás das medidas */
    object-fit:contain;object-position:center bottom;
    pointer-events:none;
    display:block;
  }

  /* ---------- cards de vidro ---------- */
  .sbz-pf-glass{
    position:absolute;
    z-index:0;
    background:rgba(255,255,255,.7);
    -webkit-backdrop-filter:blur(calc(var(--u)*10)) saturate(1.3);
            backdrop-filter:blur(calc(var(--u)*10)) saturate(1.3);
    box-shadow:0 calc(var(--u)*10) calc(var(--u)*29) rgba(49,37,105,.16);
    transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1),box-shadow .3s ease;
    transition-delay:var(--d,0s);
  }
  .sbz-pf-glass:hover{
    transform:translateY(calc(var(--u)*-6));
    box-shadow:0 calc(var(--u)*18) calc(var(--u)*40) rgba(49,37,105,.3);
  }
  .sbz-pf.is-ready:not(.is-in) .sbz-pf-glass{opacity:0;transform:translateY(calc(var(--u)*18))}
  .sbz-pf.is-done .sbz-pf-glass{transition:transform .3s ease,box-shadow .3s ease;transition-delay:0s}

  /* ---------- 1) card do produto (PDP) ---------- */
  .sbz-pf-pdp{
    --d:.15s;
    left:calc(var(--u)*332);top:calc(var(--u)*69);
    width:calc(var(--u)*166.457);height:calc(var(--u)*242.849);
    padding:calc(var(--u)*12.598);
    border-radius:calc(var(--u)*12.598);
    display:flex;flex-direction:column;gap:calc(var(--u)*12.598);
  }
  .sbz-pf-pdp__img{
    position:relative;flex:none;
    width:100%;height:calc(var(--u)*143.239);
    background:var(--sbz-skeleton);
    border-radius:calc(var(--u)*6.299);
    overflow:hidden;
  }
  .sbz-pf-pdp__img img{
    position:absolute;left:50%;top:50%;
    width:calc(var(--u)*126);height:calc(var(--u)*156);
    transform:translate(calc(-50% + var(--u)*.77),calc(-50% - var(--u)*.22));
    object-fit:cover;display:block;
  }
  .sbz-pf-pdp__lines{width:calc(var(--u)*141.261);display:flex;flex-direction:column;gap:calc(var(--u)*4.243)}
  .sbz-pf-pdp__lines i{display:block;height:calc(var(--u)*8.067);border-radius:99px;background:var(--sbz-skeleton)}
  .sbz-pf-pdp__lines i:nth-child(1){width:100%}
  .sbz-pf-pdp__lines i:nth-child(2){width:calc(var(--u)*101.26)}
  .sbz-pf-pdp__lines i:nth-child(3){width:calc(var(--u)*71.26)}

  /* ---------- 2) ajuste (altura / peso / idade) ---------- */
  .sbz-pf-ajuste{
    --d:.3s;
    left:calc(var(--u)*33);top:calc(var(--u)*114);
    width:calc(var(--u)*149.961);
    padding:calc(var(--u)*20.493) calc(var(--u)*15.764);
    border-radius:calc(var(--u)*10.246);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*4.729);
  }
  .sbz-pf-field{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*4.928)}
  .sbz-pf-field label{font-size:calc(var(--u)*14);font-weight:500;color:var(--sbz-text);white-space:nowrap}
  .sbz-pf-field input{
    width:calc(var(--u)*105.961);height:calc(var(--u)*40.66);
    margin:0;padding:0;
    background:#fff;
    border:calc(var(--u)*.9) solid var(--sbz-line);border-radius:calc(var(--u)*6);
    font:400 calc(var(--u)*16) 'Outfit',system-ui,sans-serif;color:var(--sbz-text);text-align:center;
    transition:box-shadow .2s ease;
  }
  .sbz-pf-field input:focus{outline:none;box-shadow:0 0 0 calc(var(--u)*2) rgba(132,196,241,.45)}

  /* ---------- 3) medidas (sliders) ---------- */
  .sbz-pf-datos{
    --d:.45s;
    z-index:2;                       /* na frente da foto */
    left:calc(var(--u)*325);top:calc(var(--u)*355);
    width:calc(var(--u)*241.186);
    padding:calc(var(--u)*20.493) calc(var(--u)*15.764);
    border-radius:calc(var(--u)*10.246);
    display:flex;flex-direction:column;justify-content:center;gap:calc(var(--u)*4.729);
  }
  .sbz-pf-row{display:flex;align-items:center;justify-content:space-between;height:calc(var(--u)*20.745)}
  .sbz-pf-row__label{flex:0 0 calc(var(--u)*33.104);font-size:calc(var(--u)*9.484);font-weight:500;color:var(--sbz-text-2);white-space:nowrap}
  .sbz-pf-row__bar{position:relative;flex:0 0 calc(var(--u)*104.319);height:calc(var(--u)*12.447)}
  .sbz-pf-row__bar::before{
    content:"";position:absolute;left:0;right:0;top:50%;
    height:calc(var(--u)*5);margin-top:calc(var(--u)*-2.5);
    border-radius:99px;background:#fff;
  }
  .sbz-pf-row__fill{
    position:absolute;left:0;top:50%;
    width:var(--p);height:calc(var(--u)*5);margin-top:calc(var(--u)*-2.5);
    border-radius:99px;background:var(--sbz-line);
    transition:width 1.2s cubic-bezier(.2,.7,.2,1);
  }
  .sbz-pf-row__fill::after{
    content:"";position:absolute;right:calc(var(--u)*-6.2);top:50%;
    width:calc(var(--u)*12.447);height:calc(var(--u)*12.447);margin-top:calc(var(--u)*-6.2);
    border-radius:50%;background:#fff;border:calc(var(--u)*1.2) solid var(--sbz-line);
    box-shadow:0 1px 3px rgba(4,42,68,.18);
  }
  .sbz-pf.is-ready:not(.is-in) .sbz-pf-row__fill{width:0}
  .sbz-pf-row__val{flex:0 0 calc(var(--u)*44.454);display:flex;align-items:center;justify-content:space-between}
  .sbz-pf-row__num{
    width:calc(var(--u)*28.451);height:calc(var(--u)*20.745);
    display:flex;align-items:center;justify-content:center;
    background:#fff;border:calc(var(--u)*.593) solid var(--sbz-line);border-radius:calc(var(--u)*1.778);
    font-size:calc(var(--u)*14.225);font-weight:500;color:var(--sbz-text-2);font-variant-numeric:tabular-nums;
  }
  .sbz-pf-row__unit{font-size:calc(var(--u)*9.484);font-weight:400;color:var(--sbz-text-2)}

  @media (prefers-reduced-motion:reduce){
    .sbz-pf-glass,.sbz-pf-row__fill{transition:none !important}
  }
</style>

<div class="sbz-pf" id="sbz-pf">
  <!-- Foto da modelo -->
  <img class="sbz-pf__photo" src="https://d335luupugsy2.cloudfront.net/cms/files/933366/1793187246/$8o46nudf3e4" alt="Modelo vestindo jaqueta puffer bege com gola alta">

  <!-- 1) Card do produto -->
  <div class="sbz-pf-glass sbz-pf-pdp">
    <div class="sbz-pf-pdp__img">
      <img src="https://d335luupugsy2.cloudfront.net/cms/files/933366/1793187246/$ued60sspt6b" alt="Jaqueta puffer bege com gola alta">
    </div>
    <div class="sbz-pf-pdp__lines" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>

  <!-- 2) Ajuste -->
  <div class="sbz-pf-glass sbz-pf-ajuste">
    <div class="sbz-pf-field"><label for="sbz-pf-altura">Altura</label><input id="sbz-pf-altura" type="text" value="165 cm" inputmode="numeric"></div>
    <div class="sbz-pf-field"><label for="sbz-pf-peso">Peso</label><input id="sbz-pf-peso" type="text" value="57 kg" inputmode="numeric"></div>
    <div class="sbz-pf-field"><label for="sbz-pf-idade">Idade</label><input id="sbz-pf-idade" type="text" value="28" inputmode="numeric"></div>
  </div>

  <!-- 3) Medidas -->
  <div class="sbz-pf-glass sbz-pf-datos">
    <div class="sbz-pf-row">
      <span class="sbz-pf-row__label">Busto</span>
      <span class="sbz-pf-row__bar"><span class="sbz-pf-row__fill" style="--p:50%"></span></span>
      <span class="sbz-pf-row__val"><span class="sbz-pf-row__num" data-count="81">81</span><span class="sbz-pf-row__unit">cm</span></span>
    </div>
    <div class="sbz-pf-row">
      <span class="sbz-pf-row__label">Cintura</span>
      <span class="sbz-pf-row__bar"><span class="sbz-pf-row__fill" style="--p:30%"></span></span>
      <span class="sbz-pf-row__val"><span class="sbz-pf-row__num" data-count="69">69</span><span class="sbz-pf-row__unit">cm</span></span>
    </div>
    <div class="sbz-pf-row">
      <span class="sbz-pf-row__label">Quadril</span>
      <span class="sbz-pf-row__bar"><span class="sbz-pf-row__fill" style="--p:75%"></span></span>
      <span class="sbz-pf-row__val"><span class="sbz-pf-row__num" data-count="95">95</span><span class="sbz-pf-row__unit">cm</span></span>
    </div>
  </div>
</div>

<script>
  /* Entrada dos cards ao aparecer na tela e números animados. Sem JavaScript, o bloco aparece completo e estático. */
  (function(){
    var root=document.getElementById('sbz-pf');
    if(!root)return;
    var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function countUp(){
      [].slice.call(root.querySelectorAll('[data-count]')).forEach(function(el){
        var end=parseInt(el.getAttribute('data-count'),10),from=Math.max(end-14,0),t0=null,dur=1200;
        el.textContent=from;
        function step(t){
          if(!t0)t0=t;
          var p=Math.min((t-t0)/dur,1),e=1-Math.pow(1-p,3);
          el.textContent=Math.round(from+(end-from)*e);
          if(p<1)requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      });
    }

    function show(){
      root.classList.add('is-in');
      if(!reduce)countUp();
      setTimeout(function(){root.classList.add('is-done');},1600);
    }

    if(reduce||!('IntersectionObserver' in window))return;
    root.classList.add('is-ready');
    var io=new IntersectionObserver(function(es){
      if(es[0].isIntersecting){io.disconnect();show();}
    },{threshold:.25});
    io.observe(root);
    setTimeout(function(){if(!root.classList.contains('is-in')){var r=root.getBoundingClientRect();if(r.bottom>0&&r.top<window.innerHeight){io.disconnect();show();}}},1500);
  })();
</script>
