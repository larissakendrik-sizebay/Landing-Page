<!-- ===== CSS + interações gerais (Sizebay) – colar em UM bloco HTML do RD Station, no fim da página ===== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --sbz-navy:#042a44;
    --sbz-navy-text:#07385a;
    --sbz-blue:#2f93e0;
    --sbz-pink-1:#f9cdd9;
    --sbz-pink-2:#ec9fb8;
    --sbz-pink-3:#e0829f;
  }

  html{scroll-behavior:smooth}
  ::selection{background:var(--sbz-pink-1);color:var(--sbz-navy)}

  /* =====================================================
     1) BOTÕES (rosa Sizebay): brilho que passa, pulso suave e seta
     IDs: #rd-button-moj1k302, #rd-button-mvlcq9fa, #rd-button-joq3m2m7
     Para usar em outro botão qualquer, adicione a classe sbz-btn
     ===================================================== */
:is(#rd-button-moj1k302,#rd-button-mvlcq9fa,#rd-button-joq3m2m7) a,
:is(#rd-button-moj1k302,#rd-button-mvlcq9fa,#rd-button-joq3m2m7) button,
a:is(#rd-button-moj1k302,#rd-button-mvlcq9fa,#rd-button-joq3m2m7),
button:is(#rd-button-moj1k302,#rd-button-mvlcq9fa,#rd-button-joq3m2m7),
.sbz-btn{
  position:relative !important;
  display:inline-flex !important;
  align-items:center !important;
  justify-content:center !important;
  overflow:hidden !important;
  background:linear-gradient(135deg,var(--sbz-pink-1) 0%,var(--sbz-pink-2) 55%,var(--sbz-pink-3) 100%) !important;
  color:var(--sbz-navy) !important;
  font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif !important;
  font-weight:600 !important;
  border:0 !important;
  border-radius:999px !important;
  text-decoration:none !important;
  cursor:pointer;
  box-shadow:0 8px 24px rgba(224,130,159,.42),0 0 0 0 rgba(236,159,184,.55) !important;
  transition:transform .25s ease,box-shadow .25s ease,filter .25s ease !important;
  animation:sbz-pulse 2.8s ease-out infinite;
}
:is(#rd-button-moj1k302,#rd-button-mvlcq9fa,#rd-button-joq3m2m7) a::before,
:is(#rd-button-moj1k302,#rd-button-mvlcq9fa,#rd-button-joq3m2m7) button::before,
a:is(#rd-button-moj1k302,#rd-button-mvlcq9fa,#rd-button-joq3m2m7)::before,
button:is(#rd-button-moj1k302,#rd-button-mvlcq9fa,#rd-button-joq3m2m7)::before,
.sbz-btn::before{
  content:"";
  position:absolute;
  top:0;
  left:-80%;
  width:45%;
  height:100%;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,.75),transparent);
  transform:skewX(-20deg);
  transition:left .7s ease;
  pointer-events:none;
}
:is(#rd-button-moj1k302,#rd-button-mvlcq9fa,#rd-button-joq3m2m7) a::after,
:is(#rd-button-moj1k302,#rd-button-mvlcq9fa,#rd-button-joq3m2m7) button::after,
a:is(#rd-button-moj1k302,#rd-button-mvlcq9fa,#rd-button-joq3m2m7)::after,
button:is(#rd-button-moj1k302,#rd-button-mvlcq9fa,#rd-button-joq3m2m7)::after,
.sbz-btn::after{
  content:"\2192";
  display:inline-block;
  margin-left:10px;
  font-weight:600;
  transition:transform .3s ease;
}
:is(#rd-button-moj1k302,#rd-button-mvlcq9fa,#rd-button-joq3m2m7) a:hover,
:is(#rd-button-moj1k302,#rd-button-mvlcq9fa,#rd-button-joq3m2m7) button:hover,
a:is(#rd-button-moj1k302,#rd-button-mvlcq9fa,#rd-button-joq3m2m7):hover,
button:is(#rd-button-moj1k302,#rd-button-mvlcq9fa,#rd-button-joq3m2m7):hover,
.sbz-btn:hover{
  transform:translateY(-3px) !important;
  filter:saturate(1.08);
  box-shadow:0 14px 34px rgba(224,130,159,.6),0 0 0 4px rgba(249,205,217,.45) !important;
  animation-play-state:paused;
}
:is(#rd-button-moj1k302,#rd-button-mvlcq9fa,#rd-button-joq3m2m7) a:hover::before,
:is(#rd-button-moj1k302,#rd-button-mvlcq9fa,#rd-button-joq3m2m7) button:hover::before,
a:is(#rd-button-moj1k302,#rd-button-mvlcq9fa,#rd-button-joq3m2m7):hover::before,
button:is(#rd-button-moj1k302,#rd-button-mvlcq9fa,#rd-button-joq3m2m7):hover::before,
.sbz-btn:hover::before{left:130%}
:is(#rd-button-moj1k302,#rd-button-mvlcq9fa,#rd-button-joq3m2m7) a:hover::after,
:is(#rd-button-moj1k302,#rd-button-mvlcq9fa,#rd-button-joq3m2m7) button:hover::after,
a:is(#rd-button-moj1k302,#rd-button-mvlcq9fa,#rd-button-joq3m2m7):hover::after,
button:is(#rd-button-moj1k302,#rd-button-mvlcq9fa,#rd-button-joq3m2m7):hover::after,
.sbz-btn:hover::after{transform:translateX(5px)}
:is(#rd-button-moj1k302,#rd-button-mvlcq9fa,#rd-button-joq3m2m7) a:active,
:is(#rd-button-moj1k302,#rd-button-mvlcq9fa,#rd-button-joq3m2m7) button:active,
a:is(#rd-button-moj1k302,#rd-button-mvlcq9fa,#rd-button-joq3m2m7):active,
button:is(#rd-button-moj1k302,#rd-button-mvlcq9fa,#rd-button-joq3m2m7):active,
.sbz-btn:active{transform:translateY(0) scale(.97) !important}
:is(#rd-button-moj1k302,#rd-button-mvlcq9fa,#rd-button-joq3m2m7) a:focus-visible,
:is(#rd-button-moj1k302,#rd-button-mvlcq9fa,#rd-button-joq3m2m7) button:focus-visible,
a:is(#rd-button-moj1k302,#rd-button-mvlcq9fa,#rd-button-joq3m2m7):focus-visible,
button:is(#rd-button-moj1k302,#rd-button-mvlcq9fa,#rd-button-joq3m2m7):focus-visible,
.sbz-btn:focus-visible{outline:3px solid var(--sbz-blue);outline-offset:3px}

  @keyframes sbz-pulse{
    0%{box-shadow:0 8px 24px rgba(224,130,159,.42),0 0 0 0 rgba(236,159,184,.55)}
    70%{box-shadow:0 8px 24px rgba(224,130,159,.42),0 0 0 16px rgba(236,159,184,0)}
    100%{box-shadow:0 8px 24px rgba(224,130,159,.42),0 0 0 0 rgba(236,159,184,0)}
  }

  /* =====================================================
     2) CARDS: entram suavemente e sobem ao passar o mouse
        (cards do RD pelos IDs + blocos HTML .sbz-cards, .sbz-stats e .sbz-alert)
     ===================================================== */
#rd-box-mvlbnr70,#rd-box-mvlbpz3b,#rd-box-mvlbss5b,#rd-box-mvlbss5f,#rd-box-mvlct2bs,#rd-box-mvlcul25,#rd-box-mvlcum4l,.sbz-cards__card,.sbz-stats__card,.sbz-alert{
  transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1),box-shadow .3s ease;
}
.sbz-rv{transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.sbz-pre{opacity:0;transform:translateY(28px)}
.sbz-ready{transition:transform .3s ease,box-shadow .3s ease !important;transition-delay:0s !important}
.sbz-fx:hover{
  transform:translateY(-6px);
  box-shadow:0 18px 40px rgba(4,42,68,.18);
}

  /* =====================================================
     3) FORMULÁRIO: #rd-box-joq3m2m2
     ===================================================== */
#rd-box-joq3m2m2{
  position:relative !important;
  overflow:hidden !important;
  background:rgba(255,255,255,.94) !important;
  border-radius:28px !important;
  box-shadow:0 24px 60px rgba(4,42,68,.2),inset 0 0 0 1px rgba(255,255,255,.7) !important;
  font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
#rd-box-joq3m2m2::before{
  content:"";
  position:absolute;
  top:0;left:0;right:0;
  height:5px;
  background:linear-gradient(90deg,var(--sbz-blue),var(--sbz-pink-2));
  pointer-events:none;
}
#rd-box-joq3m2m2 label{
  font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif !important;
  font-weight:500 !important;
  font-size:14px !important;
  color:var(--sbz-navy-text) !important;
}
#rd-box-joq3m2m2 input:not([type=checkbox]):not([type=radio]):not([type=submit]):not([type=hidden]),
#rd-box-joq3m2m2 select,
#rd-box-joq3m2m2 textarea{
  width:100%;
  min-height:48px;
  padding:10px 14px !important;
  font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif !important;
  font-size:15px !important;
  color:var(--sbz-navy-text) !important;
  background:#f7fafd !important;
  border:1.5px solid #c9d8e8 !important;
  border-radius:12px !important;
  box-shadow:none !important;
  transition:border-color .2s ease,box-shadow .2s ease,background-color .2s ease;
}
#rd-box-joq3m2m2 input::placeholder,
#rd-box-joq3m2m2 textarea::placeholder{color:#8aa0b6}
#rd-box-joq3m2m2 input:not([type=checkbox]):not([type=radio]):not([type=submit]):not([type=hidden]):hover,
#rd-box-joq3m2m2 select:hover,
#rd-box-joq3m2m2 textarea:hover{border-color:#9cc3e6 !important}
#rd-box-joq3m2m2 input:not([type=checkbox]):not([type=radio]):not([type=submit]):not([type=hidden]):focus,
#rd-box-joq3m2m2 select:focus,
#rd-box-joq3m2m2 textarea:focus{
  outline:none !important;
  background:#fff !important;
  border-color:var(--sbz-blue) !important;
  box-shadow:0 0 0 4px rgba(47,147,224,.18) !important;
}
#rd-box-joq3m2m2 input[aria-invalid="true"],
#rd-box-joq3m2m2 input.error{border-color:var(--sbz-pink-3) !important}
#rd-box-joq3m2m2 input[type=checkbox],
#rd-box-joq3m2m2 input[type=radio]{accent-color:var(--sbz-blue)}

  /* =====================================================
     4) Acessibilidade: sem animações para quem prefere menos movimento
     ===================================================== */
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{animation:none !important;transition:none !important}
    .sbz-pre{opacity:1;transform:none}
  }
</style>

<script>
  /* Entrada ao rolar a página (fade + subida) em títulos, textos, imagens e vídeos,
     além dos cards (que também têm hover) e da contagem dos números.
     Se este script for bloqueado pelo RD, tudo continua visível (só perde a animação de entrada). */
  (function(){
    var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var CARD_GROUPS=[
      ["#rd-box-mvlbnr70", "#rd-box-mvlbpz3b", "#rd-box-mvlbss5b", "#rd-box-mvlbss5f"],
      ["#rd-box-mvlct2bs", "#rd-box-mvlcul25", "#rd-box-mvlcum4l"],
      ['.sbz-cards__card'],
      ['.sbz-stats__card'],
      ['.sbz-alert']
    ];
    /* Também animados na entrada (sem hover): o formulário e os elementos abaixo */
    var EXTRA=['#rd-box-joq3m2m2'];
    var TAGS='h1,h2,h3,h4,h5,h6,p,img,video';
    var SKIP='a,button,form,.sbz-logos,#rd-box-joq3m2m2,.sbz-nofx';
    var CARDS=[].concat.apply([],CARD_GROUPS).join(',');

    function get(sel){return Array.prototype.slice.call(document.querySelectorAll(sel));}
    function count(el){
      var txt=(el.getAttribute('data-sbz')||el.textContent).trim();
      var m=txt.match(/^([+-]?)(\d+)(.*)$/);
      if(!m||reduce)return;
      el.setAttribute('data-sbz',txt);
      var end=parseInt(m[2],10),t0=null,dur=1100;
      function step(t){
        if(!t0)t0=t;
        var p=Math.min((t-t0)/dur,1),e=1-Math.pow(1-p,3);
        el.textContent=m[1]+Math.round(end*e)+m[3];
        if(p<1)requestAnimationFrame(step);
      }
      el.textContent=m[1]+'0'+m[3];
      requestAnimationFrame(step);
    }
    function init(){
      var items=[],seen=[];
      function add(el,delay,card){
        if(seen.indexOf(el)>-1)return;
        seen.push(el);
        items.push({el:el,delay:delay,card:card});
      }
      /* cards: escalonados dentro do grupo */
      CARD_GROUPS.forEach(function(g){
        var els=[];
        g.forEach(function(sel){els=els.concat(get(sel));});
        els.forEach(function(el,i){add(el,i*90,true);});
      });
      /* demais elementos: títulos, textos, imagens e vídeos fora de cards, botões e formulário */
      EXTRA.forEach(function(sel){get(sel).forEach(function(el){add(el,0,false);});});
      get(TAGS).forEach(function(el){
        if(el.closest(CARDS)||el.closest(SKIP))return;
        if(el.parentElement&&el.parentElement.closest('picture,figure'))return;
        add(el,null,false);
      });

      items.forEach(function(it){
        it.el.classList.add(it.card?'sbz-fx':'sbz-rv');
      });
      if(reduce||!('IntersectionObserver' in window))return;
      items.forEach(function(it){it.el.classList.add('sbz-pre');});

      var io=new IntersectionObserver(function(entries){
        var k=0;
        entries.forEach(function(en){
          if(!en.isIntersecting)return;
          var it=items.filter(function(x){return x.el===en.target;})[0];
          io.unobserve(en.target);
          var delay=it.delay;
          if(delay===null){delay=Math.min(k,5)*90;k++;}
          en.target.style.transitionDelay=delay+'ms';
          en.target.classList.remove('sbz-pre');
          Array.prototype.forEach.call(en.target.querySelectorAll('.sbz-stats__number'),count);
          setTimeout(function(){en.target.style.transitionDelay='';en.target.classList.add('sbz-ready');},delay+800);
        });
      },{threshold:.12});
      items.forEach(function(it){io.observe(it.el);});
    }
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
  })();
</script>
