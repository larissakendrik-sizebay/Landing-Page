<!-- ===== Bloco de números (Sizebay) – colar em um bloco HTML do RD Station ===== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap" rel="stylesheet">

<style>
  .sbz-stats{
    --sbz-stat-card:#ffffff;
    --sbz-stat-number:#2f82bc;
    --sbz-stat-label:#07385a;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    width:100%;
    max-width:1420px;
    margin:0 auto;
    box-sizing:border-box;
    font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  }
  .sbz-stats *{box-sizing:border-box}
  .sbz-stats__card{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:24px;
    min-height:249px;
    padding:55px 30px;
    background:var(--sbz-stat-card);
    border-radius:20px;
    text-align:center;
  }
  .sbz-stats__number{
    margin:0;
    font-size:101px;
    line-height:1;
    font-weight:600;
    color:var(--sbz-stat-number);
  }
  .sbz-stats__label{
    margin:0;
    font-size:18px;
    line-height:1.3;
    font-weight:500;
    letter-spacing:0;
    text-transform:uppercase;
    color:var(--sbz-stat-label);
  }
  @media (max-width:1100px){
    .sbz-stats__number{font-size:76px}
    .sbz-stats__card{padding:44px 20px}
  }
  @media (max-width:768px){
    .sbz-stats{grid-template-columns:repeat(2,1fr);gap:14px}
    .sbz-stats__card{min-height:0;gap:14px;padding:32px 14px}
    .sbz-stats__number{font-size:52px}
    .sbz-stats__label{font-size:14px}
  }
</style>

<div class="sbz-stats">
  <div class="sbz-stats__card">
    <p class="sbz-stats__number">5x</p>
    <p class="sbz-stats__label">Más conversión</p>
  </div>
  <div class="sbz-stats__card">
    <p class="sbz-stats__number">50%</p>
    <p class="sbz-stats__label">Menos cambios y devoluciones</p>
  </div>
  <div class="sbz-stats__card">
    <p class="sbz-stats__number">12%</p>
    <p class="sbz-stats__label">Aumento en el ticket promedio</p>
  </div>
  <div class="sbz-stats__card">
    <p class="sbz-stats__number">40%</p>
    <p class="sbz-stats__label">Probabilidad de recompra</p>
  </div>
</div>
