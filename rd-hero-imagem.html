<!-- ===== Imagem do hero com cards "vidro" (Sizebay) – colar em um bloco HTML do RD Station ===== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  .sbz-hero{
    --u:1px;                         /* 1 unidade = 1px no desenho original (688 x 760) */
    --sbz-text:#484848;
    --sbz-line:#84c4f1;
    --sbz-green:#6bc79e;
    position:relative;
    width:100%;
    max-width:688px;
    aspect-ratio:688/760;
    margin:0 auto;
    container-type:inline-size;
    font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  }
  @supports (width:1cqw){ .sbz-hero{--u:calc(100cqw / 688)} }
  .sbz-hero *{box-sizing:border-box}
  .sbz-hero__photo{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:contain;
    display:block;
  }

  /* ---------- cards de vidro ---------- */
  .sbz-glass{
    position:absolute;
    background:rgba(255,255,255,.7);
    -webkit-backdrop-filter:blur(calc(var(--u)*10)) saturate(1.3);
            backdrop-filter:blur(calc(var(--u)*10)) saturate(1.3);
    border:1px solid rgba(255,255,255,.55);
    box-shadow:0 calc(var(--u)*10) calc(var(--u)*29) rgba(49,37,105,.16);
    transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1),box-shadow .3s ease;
    transition-delay:var(--d,0s);
    cursor:default;
  }
  .sbz-glass:hover{
    transform:translateY(calc(var(--u)*-6));
    box-shadow:0 calc(var(--u)*18) calc(var(--u)*40) rgba(49,37,105,.3);
  }
  /* entrada (só ativa se o JavaScript rodar; sem JS tudo fica visível) */
  .sbz-hero.is-ready:not(.is-in) .sbz-glass{opacity:0;transform:translateY(calc(var(--u)*18))}
  .sbz-hero.is-done .sbz-glass{transition:transform .3s ease,box-shadow .3s ease;transition-delay:0s}

  /* ---------- 1) card do produto (PDP) ---------- */
  .sbz-pdp{
    --d:.15s;
    left:calc(var(--u)*49);top:calc(var(--u)*153);
    width:calc(var(--u)*166);height:calc(var(--u)*243);
    padding:calc(var(--u)*13);
    border-radius:calc(var(--u)*12.6);
  }
  .sbz-pdp__img{
    position:relative;
    width:100%;height:calc(var(--u)*143);
    background:#dde7ee;
    border-radius:calc(var(--u)*6.3);
    overflow:hidden;
  }
  .sbz-pdp__img img{
    position:absolute;
    left:calc(var(--u)*16);top:calc(var(--u)*3);
    width:calc(var(--u)*109);height:calc(var(--u)*136);
    object-fit:contain;display:block;
  }
  .sbz-pdp__lines{margin-top:calc(var(--u)*12);display:flex;flex-direction:column;gap:calc(var(--u)*4.2)}
  .sbz-pdp__lines i{display:block;height:calc(var(--u)*8);border-radius:99px;background:#dde7ee}
  .sbz-pdp__lines i:nth-child(1){width:100%}
  .sbz-pdp__lines i:nth-child(2){width:72%}
  .sbz-pdp__lines i:nth-child(3){width:50%}

  /* ---------- 2) medidas (sliders) ---------- */
  .sbz-datos{
    --d:.3s;
    left:calc(var(--u)*425);top:calc(var(--u)*412);
    width:calc(var(--u)*241);height:calc(var(--u)*113);
    padding:calc(var(--u)*16) calc(var(--u)*16);
    border-radius:calc(var(--u)*10.2);
    display:flex;flex-direction:column;justify-content:center;gap:calc(var(--u)*4.5);
  }
  .sbz-row{display:flex;align-items:center;gap:calc(var(--u)*7);height:calc(var(--u)*21)}
  .sbz-row__label{flex:0 0 calc(var(--u)*40);font-size:calc(var(--u)*9);font-weight:500;color:var(--sbz-text)}
  .sbz-row__bar{position:relative;flex:1 1 auto;height:calc(var(--u)*5);border-radius:99px;background:#fff}
  .sbz-row__fill{
    position:absolute;left:0;top:0;height:100%;
    width:var(--p);
    border-radius:99px;background:var(--sbz-line);
    transition:width 1.2s cubic-bezier(.2,.7,.2,1);
  }
  .sbz-row__fill::after{
    content:"";position:absolute;right:calc(var(--u)*-6);top:50%;
    width:calc(var(--u)*12);height:calc(var(--u)*12);margin-top:calc(var(--u)*-6);
    border-radius:50%;background:#fff;border:calc(var(--u)*1.2) solid var(--sbz-line);
    box-shadow:0 1px 3px rgba(4,42,68,.18);
  }
  .sbz-hero.is-ready:not(.is-in) .sbz-row__fill{width:0}
  .sbz-row__val{display:flex;align-items:center;gap:calc(var(--u)*3);margin-left:calc(var(--u)*6)}
  .sbz-row__num{
    min-width:calc(var(--u)*28);height:calc(var(--u)*21);
    display:flex;align-items:center;justify-content:center;
    background:#fff;border:calc(var(--u)*.6) solid var(--sbz-line);border-radius:calc(var(--u)*1.8);
    font-size:calc(var(--u)*13);font-weight:500;color:var(--sbz-text);font-variant-numeric:tabular-nums;
  }
  .sbz-row__unit{font-size:calc(var(--u)*9);color:var(--sbz-text)}

  /* ---------- 3) tamanhos ---------- */
  .sbz-sizes{
    --d:.45s;
    left:calc(var(--u)*24);top:calc(var(--u)*541);
    width:calc(var(--u)*255);height:calc(var(--u)*87);
    padding:calc(var(--u)*14) calc(var(--u)*17);
    border-radius:calc(var(--u)*11);
  }
  .sbz-sizes__head{display:flex;align-items:center;justify-content:space-between;height:calc(var(--u)*15)}
  .sbz-sizes__title{font-size:calc(var(--u)*10.5);font-weight:500;color:var(--sbz-text)}
  .sbz-sizes__pill{
    padding:0 calc(var(--u)*8);height:calc(var(--u)*15);
    display:flex;align-items:center;border-radius:99px;background:var(--sbz-green);
    font-size:calc(var(--u)*7.4);font-weight:600;letter-spacing:.02em;color:#fff;text-transform:uppercase;
  }
  .sbz-sizes__chips{display:flex;gap:calc(var(--u)*8.3);margin-top:calc(var(--u)*9)}
  .sbz-chip{
    position:relative;
    width:calc(var(--u)*38);height:calc(var(--u)*33);
    display:flex;align-items:center;justify-content:center;
    padding:0;background:#fff;
    border:calc(var(--u)*.8) solid #d2d2d2;border-radius:calc(var(--u)*4.7);
    font:400 calc(var(--u)*12) 'Poppins',system-ui,sans-serif;color:var(--sbz-text);
    cursor:pointer;
    transition:border-color .2s ease,transform .2s ease,font-weight .2s ease;
  }
  .sbz-chip:hover{border-color:var(--sbz-line);transform:translateY(calc(var(--u)*-2))}
  .sbz-chip.is-on{border-color:var(--sbz-line);font-weight:600}
  .sbz-chip.is-on::after{
    content:"";position:absolute;right:calc(var(--u)*-5);top:calc(var(--u)*-3);
    width:calc(var(--u)*14);height:calc(var(--u)*14);border-radius:50%;
    background:var(--sbz-green) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 14 14'><path d='M4 7.4l2 2 4-4.2' fill='none' stroke='white' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>") center/100% no-repeat;
  }
  .sbz-chip:focus-visible{outline:2px solid var(--sbz-line);outline-offset:2px}

  @media (prefers-reduced-motion:reduce){
    .sbz-glass,.sbz-row__fill,.sbz-chip{transition:none !important}
  }
</style>

<div class="sbz-hero" id="sbz-hero">
  <!-- 1) Foto (PNG com fundo transparente): troque o src pela URL da imagem -->
  <img class="sbz-hero__photo" src="COLE_AQUI_A_URL_DA_FOTO" alt="Casal vestindo jaquetas jeans e de camurça">

  <!-- 2) Card do produto -->
  <div class="sbz-glass sbz-pdp">
    <div class="sbz-pdp__img">
      <!-- troque o src pela URL da imagem da jaqueta -->
      <img src="COLE_AQUI_A_URL_DA_JAQUETA" alt="Jaqueta jeans com gola de veludo">
    </div>
    <div class="sbz-pdp__lines" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>

  <!-- 3) Medidas -->
  <div class="sbz-glass sbz-datos">
    <div class="sbz-row">
      <span class="sbz-row__label">Busto</span>
      <span class="sbz-row__bar"><span class="sbz-row__fill" style="--p:52%"></span></span>
      <span class="sbz-row__val"><span class="sbz-row__num" data-count="81">81</span><span class="sbz-row__unit">cm</span></span>
    </div>
    <div class="sbz-row">
      <span class="sbz-row__label">Cintura</span>
      <span class="sbz-row__bar"><span class="sbz-row__fill" style="--p:31%"></span></span>
      <span class="sbz-row__val"><span class="sbz-row__num" data-count="69">69</span><span class="sbz-row__unit">cm</span></span>
    </div>
    <div class="sbz-row">
      <span class="sbz-row__label">Quadril</span>
      <span class="sbz-row__bar"><span class="sbz-row__fill" style="--p:74%"></span></span>
      <span class="sbz-row__val"><span class="sbz-row__num" data-count="95">95</span><span class="sbz-row__unit">cm</span></span>
    </div>
  </div>

  <!-- 4) Tamanhos -->
  <div class="sbz-glass sbz-sizes">
    <div class="sbz-sizes__head">
      <span class="sbz-sizes__title">Provador Virtual</span>
      <span class="sbz-sizes__pill">Melhor escolha</span>
    </div>
    <div class="sbz-sizes__chips" role="group" aria-label="Tamanhos">
      <button type="button" class="sbz-chip">PP</button>
      <button type="button" class="sbz-chip">P</button>
      <button type="button" class="sbz-chip is-on">M</button>
      <button type="button" class="sbz-chip">G</button>
      <button type="button" class="sbz-chip">GG</button>
    </div>
  </div>
</div>

<script>
  /* Entrada dos cards ao aparecer na tela, sliders/números animados e seleção de tamanho ao clicar.
     Sem JavaScript, o bloco aparece completo e estático. */
  (function(){
    var root=document.getElementById('sbz-hero');
    if(!root)return;
    var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* seleção de tamanho */
    var chips=[].slice.call(root.querySelectorAll('.sbz-chip'));
    chips.forEach(function(c){
      c.addEventListener('click',function(){
        chips.forEach(function(x){x.classList.remove('is-on');});
        c.classList.add('is-on');
      });
    });

    /* contagem dos números */
    function countUp(){
      [].slice.call(root.querySelectorAll('[data-count]')).forEach(function(el){
        var end=parseInt(el.getAttribute('data-count'),10),from=Math.max(end-14,0),t0=null,dur=1200;
        el.textContent=from;
        function step(t){
          if(!t0)t0=t;
          var p=Math.min((t-t0)/dur,1),e=1-Math.pow(1-p,3);
          el.textContent=Math.round(from+(end-from)*e);
          if(p<1)requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      });
    }

    function show(){
      root.classList.add('is-in');
      if(!reduce)countUp();
      setTimeout(function(){root.classList.add('is-done');},1600);
    }

    if(reduce||!('IntersectionObserver' in window))return;
    root.classList.add('is-ready');
    var io=new IntersectionObserver(function(es){
      if(es[0].isIntersecting){io.disconnect();show();}
    },{threshold:.25});
    io.observe(root);
    setTimeout(function(){if(!root.classList.contains('is-in')){var r=root.getBoundingClientRect();if(r.bottom>0&&r.top<window.innerHeight){io.disconnect();show();}}},1500);
  })();
</script>
