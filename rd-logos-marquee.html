<!-- ===== Faixa de logos animada (Sizebay) – colar em um bloco HTML do RD Station ===== -->
<style>
  .sbz-logos{
    --sbz-bg:#d2ecff;
    --sbz-logo:#07385a;
    --sbz-gap:75px;
    --sbz-speed:35s;
    --sbz-scale:1;
    background:var(--sbz-bg);
    color:var(--sbz-logo);
    padding:30px 0;
    box-sizing:border-box;
    max-width:none;
    min-width:0;
  }
  .sbz-logos__viewport{
    overflow:hidden;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 8%,#000 92%,transparent 100%);
            mask-image:linear-gradient(90deg,transparent 0,#000 8%,#000 92%,transparent 100%);
  }
  .sbz-logos *{box-sizing:border-box}
  .sbz-logos__track{
    display:flex;
    align-items:center;
    width:max-content;
    animation:sbz-scroll var(--sbz-speed) linear infinite;
    will-change:transform;
  }
  .sbz-logos:hover .sbz-logos__track{animation-play-state:paused}
  .sbz-logos__item{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    padding-right:var(--sbz-gap);
  }
  .sbz-logos__item svg{
    display:block;
    height:auto;
    width:calc(var(--w) * var(--sbz-scale));
    fill:currentColor;
  }
  @keyframes sbz-scroll{
    from{transform:translateX(0)}
    to{transform:translateX(-50%)}
  }
  @media (max-width:768px){
    .sbz-logos{--sbz-gap:48px;--sbz-scale:.75;--sbz-speed:28s;padding:22px 0}
  }
  @media (prefers-reduced-motion:reduce){
    .sbz-logos__track{animation:none}
    .sbz-logos__viewport{overflow-x:auto}
  }
</style>
