<!-- ===== Faixa de logos de plataformas animada (Sizebay) – colar em um bloco HTML do RD Station ===== -->
<style>
  .sbz-plat{
    --sbz-bg:#fff;
    --sbz-gap:62px;
    --sbz-speed:40s;
    --sbz-scale:1;
    background:var(--sbz-bg);
    padding:40px 0;
    box-sizing:border-box;
    max-width:none;
    min-width:0;
  }
  .sbz-plat *{box-sizing:border-box}
  .sbz-plat__viewport{
    overflow:hidden;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 8%,#000 92%,transparent 100%);
            mask-image:linear-gradient(90deg,transparent 0,#000 8%,#000 92%,transparent 100%);
  }
  .sbz-plat__track{
    display:flex;
    align-items:center;
    width:max-content;
    animation:sbz-plat-scroll var(--sbz-speed) linear infinite;
    will-change:transform;
  }
  .sbz-plat:hover .sbz-plat__track{animation-play-state:paused}
  .sbz-plat__item{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    padding-right:var(--sbz-gap);
  }
  .sbz-plat__item svg{
    display:block;
    height:auto;
    width:calc(var(--w) * var(--sbz-scale));
  }
  @keyframes sbz-plat-scroll{
    from{transform:translateX(0)}
    to{transform:translateX(-50%)}
  }
  @media (max-width:768px){
    .sbz-plat{--sbz-gap:40px;--sbz-scale:.7;--sbz-speed:30s;padding:28px 0}
  }
  @media (prefers-reduced-motion:reduce){
    .sbz-plat__track{animation:none}
    .sbz-plat__viewport{overflow-x:auto}
  }
</style>

<script>
  /* Faz a faixa ocupar a largura total da página (a mesma do hero/seções vizinhas),
     mesmo que o bloco do RD esteja dentro de colunas com margem ou padding. */
  (function(){
    var el=document.currentScript.previousElementSibling;
    if(!el||!el.classList.contains('sbz-plat'))return;
    function fit(){
      el.style.marginLeft='0';
      el.style.width='auto';
      var r=el.getBoundingClientRect();
      var best=null,p=el.parentElement;
      while(p&&p!==document.body&&p!==document.documentElement){
        var pr=p.getBoundingClientRect();
        if(!best||pr.width>best.width+0.5)best={left:pr.left,width:pr.width};
        p=p.parentElement;
      }
      if(!best||best.width<=r.width+0.5)best={left:0,width:document.documentElement.clientWidth};
      el.style.marginLeft=(best.left-r.left)+'px';
      el.style.width=best.width+'px';
    }
    fit();
    window.addEventListener('resize',fit);
    window.addEventListener('load',fit);
  })();
</script>
