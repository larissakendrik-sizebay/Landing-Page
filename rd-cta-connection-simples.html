<!-- ===== Banner CTA "Nos vemos no Connection 2027!" – versão simples (Sizebay) – colar em um bloco HTML do RD Station =====
     Mesma estrutura do banner com efeito cromado, mas com o título em branco (sem shader),
     preenchimento a 5% e borda em degradê. Funciona em qualquer navegador. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">

<style>
  .sbz-cta2{
    --sbz-cta-blue:#0064fd;
    --sbz-cta-text:#f5f5f9;
    --sbz-cta-bw:1.826px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:104.696px;
    width:100%;
    max-width:994.22px;
    margin:0 auto;
    padding:31.652px 53.565px;
    background:rgba(255,255,255,.05);
    border-radius:12.174px;
    box-sizing:border-box;
    font-family:'Chakra Petch',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  }
  .sbz-cta2 *{box-sizing:border-box}

  /* Borda em degradê (#f5f5f9 → azul → branco → rosa), por dentro do bloco */
  .sbz-cta2::before{
    content:"";
    position:absolute;
    inset:0;
    padding:var(--sbz-cta-bw);
    border-radius:inherit;
    background:linear-gradient(171.57deg,#f5f5f9 -65%,#0064fd 11.8%,#fff 73.1%,#f9039b 126.8%);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
    pointer-events:none;
  }

  /* Título com skew + escala, igual ao Figma */
  .sbz-cta2__title-wrap{
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 410.742px;
    max-width:100%;
    min-height:72.36px;
  }
  .sbz-cta2__title-inner{
    flex:none;
    transform:scaleY(.99) skewX(-7.59deg);
  }
  .sbz-cta2__title{
    margin:0;
    width:401.094px;
    max-width:100%;
    font-weight:700;
    font-size:43.192px;
    line-height:1;
    text-transform:uppercase;
    color:#fff;
    word-break:break-word;
    text-box:trim-both cap alphabetic;
  }

  /* Botão CTA */
  .sbz-cta2__btn{
    position:relative;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    flex-shrink:0;
    padding:20px 24px 20px 32px;
    background:var(--sbz-cta-blue);
    border-radius:8px;
    color:var(--sbz-cta-text);
    font-weight:600;
    font-size:16px;
    line-height:1;
    letter-spacing:1.28px;
    text-transform:uppercase;
    text-decoration:none;
    white-space:nowrap;
    cursor:pointer;
    overflow:hidden;
    isolation:isolate;
    transition:box-shadow 240ms cubic-bezier(.2,.8,.2,1),transform 240ms cubic-bezier(.2,.8,.2,1);
  }
  /* Hover: gradiente azul → azul claro (camada com fade para animar) */
  .sbz-cta2__btn::before{
    content:"";
    position:absolute;
    inset:0;
    z-index:-1;
    background:linear-gradient(90deg,#0064fd 0%,#4db8ff 100%);
    opacity:0;
    transition:opacity 240ms cubic-bezier(.2,.8,.2,1);
  }
  .sbz-cta2__btn:hover,
  .sbz-cta2__btn:focus-visible{
    box-shadow:0 0 24px rgba(77,219,255,.55),0 0 6px rgba(77,219,255,.6);
  }
  .sbz-cta2__btn:hover::before,
  .sbz-cta2__btn:focus-visible::before{opacity:1}
  .sbz-cta2__btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
  .sbz-cta2__icon{
    display:block;
    width:28px;
    height:28px;
    flex:none;
    transition:transform 240ms cubic-bezier(.2,.8,.2,1);
  }
  .sbz-cta2__btn:hover .sbz-cta2__icon,
  .sbz-cta2__btn:focus-visible .sbz-cta2__icon{transform:translateX(6px)}

  @media (prefers-reduced-motion:reduce){
    .sbz-cta2__btn,.sbz-cta2__btn::before,.sbz-cta2__icon{transition:none}
  }

  /* Container menor: empilha título e botão */
  @media (max-width:900px){
    .sbz-cta2{
      flex-direction:column;
      gap:32px;
      padding:28px 24px;
      text-align:center;
    }
    .sbz-cta2__title-wrap{flex:0 0 auto;width:100%;min-width:0}
    .sbz-cta2__title-inner{flex:0 1 auto;width:100%;max-width:401.094px;min-width:0}
    .sbz-cta2__title{width:100%}
    .sbz-cta2__btn{width:100%;max-width:360px;white-space:normal;text-align:center}
  }
  @media (max-width:480px){
    .sbz-cta2__title{font-size:34px}
    .sbz-cta2__btn{font-size:14px;letter-spacing:1px;padding:18px 20px 18px 24px}
  }
</style>

<div class="sbz-cta2">
  <div class="sbz-cta2__title-wrap">
    <div class="sbz-cta2__title-inner">
      <p class="sbz-cta2__title">Nos vemos no Connection 2027!</p>
    </div>
  </div>

  <a class="sbz-cta2__btn" href="https://chat.whatsapp.com/LINK-OFICIAL-DO-GRUPO" target="_blank" rel="noopener">
    <span>Entrar no grupo do evento</span>
    <svg class="sbz-cta2__icon" viewBox="0 0 28 28" fill="none" aria-hidden="true">
      <path d="M6 7l7 7-7 7M12 7l7 7-7 7M18 7l7 7-7 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </a>
</div>
